<!--Build password meter - 
as the user types a password, show a live strength indicator (weak, medium, strong)
with a colored bar that grows/changes color-->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Strength Meter</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 40px;
        }
        input {
            width: 300px;
            padding: 10px;
            font-size: 16px;
        }
        .bar {
            width: 300px;
            height: 10px;
            background-color: #ddd;
            margin-top: 10px;
        }
        #strengthBar {   /*creates outer empty bar*/
            background-color: #ddd;
            height: 100%;
            width: 0%;
        }
        #strengthText {
            margin-top: 10px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <h2>Password Strength Meter</h2>

    <input type="password" id="password" placeholder="************">
    <button id="togglePassword">Show</button>

    <div class="bar">
        <div id="strengthBar"></div>
    </div>
    <p id="strengthText">Enter a password </p>

    <script>
        const password = document.getElementById("password");
        const strengthBar = document.getElementById("strengthBar");
        const strengthText = document.getElementById("strengthText");
        const togglePassword = document.getElementById("togglePassword");

        password.addEventListener("input", function () {

            let value = password.value;  //gets wtever the user types
            let strength = 0;

            // Check password conditions
            
            if (value.length >= 8) {
                strength++;
            }

            if (/[A-Z]/.test(value)) {  //checking upper case
                strength++;
            }

            if (/[0-9]/.test(value)) {    //find any digit from 0 to 9
                strength++;
            }

            if (/[^A-Za-z0-9]/.test(value)) {  //checks special characters
                strength++;
            }

            // Updating the meter
            if (strength === 0) {
                strengthBar.style.width = "0%";
                strengthText.textContent = "Enter a password";
            }
            else if (strength === 1) {
                strengthBar.style.width = "25%";  //bar becomes 25%
                strengthBar.style.backgroundColor = "red";
                strengthText.textContent = "Weak";
            }
            else if (strength === 2) {
                strengthBar.style.width = "50%"; //bar becomes 50%
                strengthBar.style.backgroundColor = "orange";
                strengthText.textContent = "Medium";
            }
            else if (strength === 3) {
                strengthBar.style.width = "75%";  //bar becomes 75%
                strengthBar.style.backgroundColor = "yellowgreen";
                strengthText.textContent = "Medium";
            }
            else {
                strengthBar.style.width = "100%";  //all 4 conditions are satisfied
                strengthBar.style.backgroundColor = "green";
                strengthText.textContent = "Strong";
            }
        });

        togglePassword.addEventListener("click", function () {  //user clicks show js runs this function
            if (password.type === "password") {  //if condition is true, then if executes
                password.type = "text";   //this changes the password type from password to text
                togglePassword.textContent = "Hide";  //change the button text
            } 
            else {
                password.type = "password"; 
                togglePassword.textContent = "Show";
            }
        });

    </script>

</body>
</html>
