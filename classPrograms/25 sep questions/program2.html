<!--Write a js program to accept three numbers from the user and find the largest number without using Math.max()-->

<!DOCTYPE html>
<html>
<head>
    <title>Find Largest Number</title>
</head>
<body>

    <h2>Find Largest of Three Numbers</h2>

    <script>
        let a = Number(prompt("Enter first number:"));
        let b = Number(prompt("Enter second number:"));
        let c = Number(prompt("Enter third number:"));

        let largest;

        if (a >= b && a >= c) {
            largest = a;
        } else if (b >= a && b >= c) {
            largest = b;
        } else {
            largest = c;
        }

        document.write("First Number: " + a + "<br>");
        document.write("Second Number: " + b + "<br>");
        document.write("Third Number: " + c + "<br><br>");
        document.write("Largest Number = " + largest);
    </script>

</body>
</html>
